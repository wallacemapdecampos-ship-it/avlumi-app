name: Build Avlumi (.exe)

# Como lançar / atualizar o app:
#  1) aumente a "version" em package.json (ex.: 1.0.0 -> 1.0.1)
#  2) aba Actions -> este workflow -> "Run workflow"
# Ele builda o instalador do Windows e publica em "Releases" (que também é o servidor de auto-update).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Build e publicar o instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
