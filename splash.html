<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-drag:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0d1a}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    color:#f1f2fb;-webkit-app-region:drag;position:relative;
  }
  /* luzes de fundo (igual o site) */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
  body::before{width:360px;height:360px;background:#4f7cff;top:-120px;left:-100px}
  body::after{width:360px;height:360px;background:#9b45ff;bottom:-120px;right:-100px}
  .logo{
    width:112px;height:112px;border-radius:28px;display:block;position:relative;z-index:1;
    box-shadow:0 20px 60px rgba(123,78,255,.45);
    animation:pop .6s cubic-bezier(.2,.8,.2,1) both, float 3s ease-in-out .6s infinite;
  }
  .name{
    margin-top:22px;font-size:30px;font-weight:900;letter-spacing:.5px;position:relative;z-index:1;
    background:linear-gradient(120deg,#8db0ff,#c79bff);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:fade .5s ease .25s both;
  }
  .tag{margin-top:6px;font-size:13px;color:#a6a8c9;position:relative;z-index:1;animation:fade .5s ease .4s both}
  .bar{
    margin-top:30px;width:220px;height:5px;border-radius:99px;overflow:hidden;position:relative;z-index:1;
    background:rgba(255,255,255,.08);animation:fade .5s ease .55s both;
  }
  .bar::after{
    content:"";position:absolute;left:0;top:0;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,#4f7cff,#9b45ff);
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{0%{left:-40%}100%{left:100%}}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
